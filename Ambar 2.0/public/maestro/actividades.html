<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Actividades — TecNM Ámbar</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--navy:#0D1B3E;--navy-light:#152347;--navy-mid:#1D3461;--gold:#E8A100;--gold-lt:#FFF3D0;--gold-glow:rgba(232,161,0,.18);--bg:#F0F4FA;--card:#FFFFFF;--text:#1A1F36;--text-2:#5A6488;--border:#E2E8F0;--success:#0FAF7A;--danger:#E84040;--warn:#F59E0B;--info:#3B82F6;--radius:14px;--shadow:0 4px 24px rgba(13,27,62,.09);--shadow-md:0 8px 40px rgba(13,27,62,.14)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);display:flex;flex-direction:column;height:100vh;overflow:hidden}
.topbar{background:var(--navy);height:58px;display:flex;align-items:center;justify-content:space-between;padding:0 24px;position:fixed;inset:0 0 auto 0;z-index:200;box-shadow:0 2px 16px rgba(0,0,0,.3)}
.topbar-left{display:flex;align-items:center;gap:16px}
.hbg{color:white;font-size:22px;cursor:pointer;width:36px;height:36px;display:flex;align-items:center;justify-content:center;border-radius:8px;transition:.2s}
.hbg:hover{background:rgba(255,255,255,.12)}
.brand{display:flex;align-items:center;gap:10px}
.brand-badge{width:36px;height:36px;background:var(--gold);border-radius:8px;display:flex;align-items:center;justify-content:center;font-family:'Outfit',sans-serif;font-size:11px;font-weight:800;color:var(--navy);line-height:1.1;text-align:center}
.brand-name{color:white;font-family:'Outfit',sans-serif;font-size:13px;font-weight:600;line-height:1.3}
.brand-name span{display:block;font-size:10px;font-weight:300;opacity:.7;letter-spacing:.6px;text-transform:uppercase}
.topbar-right{display:flex;align-items:center;gap:12px}
.doc-tag{background:rgba(232,161,0,.2);border:1px solid rgba(232,161,0,.4);color:var(--gold);font-size:11px;font-weight:600;padding:4px 10px;border-radius:20px;letter-spacing:.4px;text-transform:uppercase}
.avatar{width:34px;height:34px;background:var(--gold);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;cursor:pointer;font-weight:700;color:var(--navy)}
.logout-btn{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);color:rgba(255,255,255,.8);font-size:12px;padding:6px 12px;border-radius:8px;cursor:pointer;transition:.2s;font-family:'DM Sans',sans-serif}
.logout-btn:hover{background:rgba(255,255,255,.15);color:white}
.layout{display:flex;margin-top:58px;height:calc(100vh - 58px);overflow:hidden}
.sidebar{width:235px;background:var(--navy);display:flex;flex-direction:column;transition:width .28s cubic-bezier(.4,0,.2,1);overflow:hidden;flex-shrink:0}
.sidebar.collapsed{width:60px}
.main{flex:1;overflow-y:auto;padding:28px 32px;background:var(--bg)}
.page-header{margin-bottom:22px;animation:fadeUp .5s ease both}
.page-header h1{font-family:'Outfit',sans-serif;font-size:26px;font-weight:700;color:var(--navy);letter-spacing:-.3px}
.page-header p{font-size:13.5px;color:var(--text-2);margin-top:3px}
.breadcrumb{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text-2);margin-bottom:8px}
.breadcrumb span{color:var(--gold);font-weight:600}

/* SEARCH + ACTIONS BAR */
.filter-bar{display:flex;align-items:center;gap:12px;margin-bottom:20px;animation:fadeUp .5s ease .08s both}
.search-box{display:flex;align-items:center;background:var(--card);border:1px solid var(--border);border-radius:8px;padding:9px 14px;gap:8px;flex:1;max-width:380px;transition:.15s;box-shadow:var(--shadow)}
.search-box:focus-within{border-color:var(--gold);box-shadow:0 0 0 3px var(--gold-glow)}
.search-box input{border:none;outline:none;font-size:13px;color:var(--text);font-family:'DM Sans',sans-serif;width:100%;background:transparent}
.search-box input::placeholder{color:var(--text-2)}
.btn-add{background:var(--gold);color:var(--navy);font-size:13px;font-weight:700;padding:9px 18px;border-radius:8px;border:none;cursor:pointer;transition:.2s;font-family:'DM Sans',sans-serif;display:flex;align-items:center;gap:6px}
.btn-add:hover{background:#d4930a;box-shadow:0 4px 14px rgba(232,161,0,.4)}

/* TABLE CARD */
.table-card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);border:1px solid var(--border);overflow:hidden;animation:fadeUp .5s ease .12s both}
.tc-head{display:flex;align-items:center;justify-content:space-between;padding:16px 22px;border-bottom:1px solid var(--border)}
.tc-title{font-family:'Outfit',sans-serif;font-size:15px;font-weight:700;color:var(--navy);display:flex;align-items:center;gap:8px}
.tc-title-icon{width:28px;height:28px;border-radius:7px;background:var(--gold-lt);color:var(--gold);display:flex;align-items:center;justify-content:center;font-size:14px}
.tc-count{background:var(--gold-lt);color:var(--gold);font-size:11.5px;font-weight:700;padding:3px 10px;border-radius:20px;border:1px solid rgba(232,161,0,.3)}

table{width:100%;border-collapse:collapse}
thead th{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.7px;color:var(--text-2);padding:10px 22px;border-bottom:1px solid var(--border);text-align:left;background:#FAFBFF}
tbody td{font-size:13px;padding:13px 22px;border-bottom:1px solid #F1F5FB;color:var(--text);vertical-align:middle}
tbody tr:last-child td{border-bottom:none}
tbody tr{transition:background .15s;animation:fadeUp .4s ease both}
tbody tr:nth-child(1){animation-delay:.15s}
tbody tr:nth-child(2){animation-delay:.2s}
tbody tr:nth-child(3){animation-delay:.25s}
tbody tr:nth-child(4){animation-delay:.3s}
tbody tr:nth-child(5){animation-delay:.35s}
tbody tr:hover td{background:#F8FBFF}

/* ITEM STYLES */
.act-unit{font-size:13px;color:var(--navy);font-weight:600;margin-bottom:6px}
.act-list{padding-left:18px;font-size:12.5px;color:var(--text-2);line-height:1.8}
.act-list li{margin-bottom:2px}

/* BUTTONS */
.btn-group{display:flex;gap:6px;flex-wrap:wrap}
.btn-sm{font-size:12px;font-weight:600;padding:6px 12px;border-radius:7px;border:none;cursor:pointer;transition:.18s;font-family:'DM Sans',sans-serif}
.btn-edit{background:var(--gold-lt);color:var(--gold);border:1px solid rgba(232,161,0,.4)}
.btn-edit:hover{background:#FFE8A0;border-color:var(--gold)}
.btn-delete{background:#FEF2F2;color:var(--danger);border:1px solid rgba(232,64,64,.25)}
.btn-delete:hover{background:#FFE0E0;border-color:var(--danger)}
/* Estilos del Modal alineados con actividades.html */
.modal-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(13, 27, 62, 0.7); /* --navy con transparencia */
  z-index: 1000;
  backdrop-filter: blur(4px);
  align-items: center;
  justify-content: center;
  animation: fadeIn 0.3s ease;
}
.modal-content {
  background: var(--card);
  width: 90%;
  max-width: 500px;
  border-radius: var(--radius);
  box-shadow: var(--shadow-md);
  overflow: hidden;
  border: 1px solid var(--border);
}
.modal-header {
  background: var(--navy);
  padding: 18px 24px;
  color: white;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.modal-header h2 {
  font-family: 'Outfit', sans-serif;
  font-size: 18px;
  font-weight: 600;
}
.modal-body {
  padding: 24px;
}
.form-group {
  margin-bottom: 18px;
}
.form-group label {
  display: block;
  font-size: 12px;
  font-weight: 700;
  text-transform: uppercase;
  color: var(--text-2);
  margin-bottom: 8px;
  letter-spacing: 0.5px;
}
.form-input {
  width: 100%;
  padding: 12px;
  border: 1px solid var(--border);
  border-radius: 8px;
  font-family: 'DM Sans', sans-serif;
  font-size: 14px;
  transition: 0.2s;
}
.form-input:focus {
  outline: none;
  border-color: var(--gold);
  box-shadow: 0 0 0 3px var(--gold-glow);
}
.modal-footer {
  padding: 16px 24px;
  background: #f8fafc;
  display: flex;
  justify-content: flex-end;
  gap: 12px;
  border-top: 1px solid var(--border);
}

@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-left">
    <span class="hbg" onclick="document.getElementById('sidebar').classList.toggle('collapsed')">☰</span>
    <div class="brand">
      <div class="brand-badge">TEC<br>NM</div>
      <div class="brand-name">Tecnológico Nacional de México<span>Portal Docentes</span></div>
    </div>
  </div>
  <div class="topbar-right">
    <span class="doc-tag">Docente</span>
    <div class="avatar">👨‍🏫</div>
    <button class="logout-btn">Cerrar sesión</button>
  </div>
</header>

<div class="layout">
  <aside class="sidebar" id="sidebar">
    <div id="sidebar-container" style="display:flex;flex-direction:column;height:100%"></div>
    <script src="sidebarm.js"></script>
  </aside>

  <main class="main">
    <div class="breadcrumb">Portal Docentes <span>›</span> <span>Actividades</span></div>
    <div class="page-header">
      <h1>Gestión de Actividades</h1>
      <p>Administra las actividades de aprendizaje de tus materias</p>
    </div>

    <div class="filter-bar">
      <div class="search-box">
        <span style="color:var(--text-2)">🔍</span>
        <input type="text" id="busqueda" placeholder="Buscar actividad por nombre o descripción...">
      </div>
      <button class="btn-add" id="open-modal">＋ Nueva actividad</button>
    </div>
<div class="modal-overlay" id="act-modal">
  <div class="modal-content">
    <div class="modal-header">
      <span style="color:var(--text-2)">🔍</span>
      <h2 id="modal-title">＋ Registrar Nueva Actividad</h2>
      <span style="cursor:pointer; font-size:20px" id="close-modal">✕</span>
    </div>
    <div class="modal-body">
      <input type="hidden" id="edit-id">
      
      <div class="form-group">
        <label>Unidad Temática</label>
        <select id="act-unit-input" class="form-input">
          <option value="Unidad 1">Unidad 1</option>
          <option value="Unidad 2">Unidad 2</option>
          <option value="Unidad 3">Unidad 3</option>
          <option value="Unidad 4">Unidad 4</option>
          <option value="Unidad 5">Unidad 5</option>
        </select>
      </div>

      <div class="form-group">
        <label>Nombre de la Actividad</label>
        <input type="text" id="act-title-input" class="form-input" placeholder="Ej: Proyecto Final">
      </div>

      <div class="form-group">
        <label>Descripción / Tareas</label>
        <textarea id="act-desc-input" class="form-input" rows="3" placeholder="Detalla las instrucciones..."></textarea>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn-sm" style="background:#eee; color:var(--text-2)" id="cancel-modal">Cancelar</button>
      <button class="btn-add" id="save-btn">Guardar Actividad</button>
    </div>
  </div>
</div>
    <div class="table-card">
      <div class="tc-head">
        <div class="tc-title"><div class="tc-title-icon">📋</div> Actividades registradas</div>
        <span class="tc-count" id="act-count">0actividades</span>
      </div>
      <table id="tabla-actividades">
        <thead>
          <tr>
            <th style="width:70%">Descripción de la Actividad</th>
            <th style="width:30%">Opciones</th>
          </tr>
        </thead>
        <tbody>
          <!-- Las actividades se cargarán aquí dinámicamente -->
        </tbody>
      </table>
    </div>

  </main>
</div>
<script>
document.addEventListener("DOMContentLoaded", function () {

    let activities = JSON.parse(localStorage.getItem('docente_actividades')) || [
        {
            id: 1,
            unit: "Unidad 1",
            title: "Investigación",
            desc: "Definición, objetivos y ventajas de BI."
        },
        {
            id: 2,
            unit: "Unidad 2",
            title: "Presentación",
            desc: "Avances del primer parcial."
        }
    ];
    const tableBody = document.querySelector("#tabla-actividades tbody");
    const modal = document.getElementById("act-modal");
    const openBtn = document.getElementById("open-modal");
    const closeBtn = document.getElementById("close-modal");
    const cancelBtn = document.getElementById("cancel-modal");
    const saveBtn = document.getElementById("save-btn");
    const searchInput = document.getElementById("busqueda");
    // GUARDAR EN LOCAL STORAGE
    function saveToLocal() {
        localStorage.setItem(
            'docente_actividades',
            JSON.stringify(activities)
        );
        render();
    }
    // RENDER TABLA
    function render(filter = '') {
        tableBody.innerHTML = '';
        const filtered = activities.filter(a =>
            a.title.toLowerCase().includes(filter.toLowerCase()) ||
            a.desc.toLowerCase().includes(filter.toLowerCase()) ||
            a.unit.toLowerCase().includes(filter.toLowerCase())
        );
        filtered.forEach(act => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>
                    <div class="act-unit">${act.unit}</div>
                    <ul class="act-list">
                        <li>
                            <strong>${act.title}:</strong>
                            ${act.desc}
                        </li>
                    </ul>
                </td>
                <td>
                    <div class="btn-group">
                        <button
                            class="btn-sm btn-edit"
                            onclick="editAct(${act.id})">
                            Editar
                        </button>
                        <button
                            class="btn-sm btn-delete"
                            onclick="deleteAct(${act.id})">
                            Eliminar
                        </button>
                    </div>
                </td>
            `;
            tableBody.appendChild(tr);
        });
        document.getElementById("act-count").textContent =
            `${filtered.length} actividades`;
    }
    // ELIMINAR
    window.deleteAct = function(id) {
        if (confirm("¿Eliminar esta actividad?")) {
            activities = activities.filter(a => a.id !== id);
            saveToLocal();
        }
    };
    // EDITAR
    window.editAct = function(id) {
        const act = activities.find(a => a.id === id);
        document.getElementById("edit-id").value = act.id;
        document.getElementById("act-unit-input").value = act.unit;
        document.getElementById("act-title-input").value = act.title;
        document.getElementById("act-desc-input").value = act.desc;
        document.getElementById("modal-title").textContent ="✎ Editar Actividad";
        modal.style.display = "flex";
    };
    // ABRIR MODAL
    openBtn.onclick = () => {
        document.getElementById("edit-id").value = "";
        document.getElementById("act-unit-input").value = "Unidad 1";
        document.getElementById("act-title-input").value = "";
        document.getElementById("act-desc-input").value = "";
        document.getElementById("modal-title").textContent =
            "＋ Registrar Nueva Actividad";
        modal.style.display = "flex";
    };
    // CERRAR MODAL
    function closeModal() {
        modal.style.display = "none";
    }
    closeBtn.onclick = closeModal;
    cancelBtn.onclick = closeModal;
    // GUARDAR ACTIVIDAD
    saveBtn.onclick = () => {
        const id = document.getElementById("edit-id").value;
        const unit =
            document.getElementById("act-unit-input").value;
        const title =
            document.getElementById("act-title-input").value.trim();
        const desc =
            document.getElementById("act-desc-input").value.trim();
        if (!title || !desc) {
            alert("Completa todos los campos");
            return;
        }
        if (id) {
            const index =
                activities.findIndex(a => a.id == id);
            activities[index] = {
                ...activities[index],
                unit,
                title,
                desc
            };
        } else {
            activities.push({
                id: Date.now(),
                unit,
                title,
                desc
            });
        }
        saveToLocal();
        closeModal();
    };
    // BUSCADOR
    searchInput.addEventListener("keyup", (e) => {
        render(e.target.value);
    });
    // CERRAR MODAL SI DAN CLICK FUERA
    window.onclick = function(e) {
        if (e.target === modal) {
            closeModal();
        }
    };
    render();
});
</script>
</body>
</html>
