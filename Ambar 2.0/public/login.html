<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AMBAR — Inicio de Sesión</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
 
    body {
      font-family: 'Montserrat', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background: linear-gradient(to bottom, #1b3a6b 55%, #f0f0f0 55%);
    }
 
    .wrapper {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 16px;
    }
 
    .card {
      background: #ffffff;
      border-radius: 10px;
      box-shadow: 0 6px 36px rgba(0,0,0,0.22);
      width: 100%;
      max-width: 410px;
      padding: 38px 42px 32px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
 
    .logo-area {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 18px;
    }
 
    .logo-label {
      display: flex;
      flex-direction: column;
      gap: 1px;
    }
    .logo-label span {
      font-size: 11.5px;
      font-weight: 700;
      color: #1b3a6b;
      letter-spacing: 0.03em;
      text-transform: uppercase;
      line-height: 1.3;
    }
    .logo-label .reg {
      font-size: 9px;
      font-weight: 400;
      color: #777;
      letter-spacing: 0;
    }
 
    .app-title {
      font-size: 21px;
      font-weight: 700;
      color: #1b3a6b;
      letter-spacing: 0.07em;
      text-align: center;
      margin-bottom: 3px;
    }
    .app-sub {
      font-size: 13px;
      font-weight: 600;
      color: #1b3a6b;
      letter-spacing: 0.09em;
      text-align: center;
      margin-bottom: 18px;
    }
 
    .divider {
      width: 100%;
      border: none;
      border-top: 1px solid #ddd;
      margin-bottom: 18px;
    }
 
    .welcome {
      font-size: 12.5px;
      font-weight: 500;
      color: #333;
      text-align: center;
      line-height: 1.55;
      margin-bottom: 22px;
    }
 
    .form { width: 100%; display: flex; flex-direction: column; gap: 15px; }
    .field { display: flex; flex-direction: column; gap: 5px; }
 
    label {
      font-size: 11.5px;
      font-weight: 700;
      color: #c0392b;
      letter-spacing: 0.01em;
    }
 
    input[type="text"],
    input[type="password"] {
      width: 100%;
      padding: 9px 13px;
      border: 1.5px solid #c8c87a;
      border-radius: 5px;
      background: #fafae0;
      font-size: 13.5px;
      font-family: 'Montserrat', sans-serif;
      color: #333;
      outline: none;
      transition: border-color .2s, background .2s;
    }
    input:focus {
      border-color: #1b3a6b;
      background: #eef1fb;
    }
 
    .pwd-wrap { position: relative; }
    .pwd-wrap input { padding-right: 40px; }
    .eye-btn {
      position: absolute;
      right: 11px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      color: #999;
      padding: 0;
      display: flex;
      align-items: center;
    }
    .eye-btn:hover { color: #1b3a6b; }
 
    .btn-login {
      width: 100%;
      padding: 11.5px;
      margin-top: 4px;
      background: #1b3a6b;
      color: #fff;
      font-family: 'Montserrat', sans-serif;
      font-size: 13.5px;
      font-weight: 700;
      letter-spacing: 0.04em;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      transition: background .2s, opacity .2s;
    }
    .btn-login:hover:not(:disabled) { background: #14305a; }
    .btn-login:disabled { opacity: .6; cursor: not-allowed; }
 
    .card-hr {
      width: 100%;
      border: none;
      border-top: 1px solid #ddd;
      margin: 22px 0 16px;
    }
 
    .btn-support {
      width: 100%;
      padding: 10.5px;
      background: #e4e4e4;
      color: #555;
      font-family: 'Montserrat', sans-serif;
      font-size: 12.5px;
      font-weight: 600;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: background .2s;
    }
    .btn-support:hover { background: #d4d4d4; }
 
    #mensaje {
      text-align: center;
      font-size: 13px;
      margin-top: 10px;
      min-height: 20px;
      font-family: 'Montserrat', sans-serif;
    }
 
    footer {
      text-align: center;
      padding: 12px 0 20px;
      font-size: 11.5px;
      color: #777;
    }
    footer a { color: #2980b9; text-decoration: none; }
    footer a:hover { text-decoration: underline; }
  </style>
</head>
<body>
 
<div class="wrapper">
  <div class="card">
 
    <!-- Logo -->
    <div class="logo-area">
      <img src="img/logo.png" style="width:100px;height:100px;" onerror="this.style.display='none'">
      <div class="logo-label">
        <span>Tecnológico</span>
        <span>Nacional de México</span>
        <span class="reg">®</span>
      </div>
    </div>
 
    <div class="app-title">AMBAR</div>
    <div class="app-sub">TIJUANA</div>
    <hr class="divider"/>
    <p class="welcome">Bienvenido, ingresa tus credenciales para acceder a la plataforma</p>
 
    <div class="form">
      <div class="field">
        <label for="control">Número de Control</label>
        <input type="text" id="control" placeholder="Número de control"
               autocomplete="off" oninput="this.value=this.value.replace(/\s/g,'')"/>
      </div>
 
      <div class="field">
        <label for="password">Contraseña</label>
        <div class="pwd-wrap">
          <input type="password" id="password" placeholder="Contraseña"
                 oninput="this.value=this.value.replace(/\s/g,'')"
                 onkeydown="if(event.key==='Enter') doLogin()"/>
          <button class="eye-btn" type="button" onclick="togglePwd()" title="Mostrar/ocultar">
            <svg id="eye-icon" width="18" height="18" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </div>
      </div>
 
      <button class="btn-login" type="button" id="btn-login">
        Iniciar Sesión
      </button>
    </div>
 
    <div id="mensaje"></div>
 
    <div class="card-hr"></div>
 
    <button class="btn-support" type="button" id="btn-support">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"/>
        <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/>
        <line x1="12" y1="17" x2="12.01" y2="17"/>
      </svg>
      Soporte AMBAR
    </button>
 
  </div>
</div>
 
<footer>
  &copy; 2026 by <a href="#">iFix</a> &ndash; <a href="#">Política de Privacidad</a>
</footer>
 
<script>
  function togglePwd() {
    const input = document.getElementById('password');
    const icon = document.getElementById('eye-icon');

    if (input.type === 'password') {
      input.type = 'text';
      icon.innerHTML = `
        <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
        <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
        <line x1="1" y1="1" x2="23" y2="23"/>`;
    } else {
      input.type = 'password';
      icon.innerHTML = `
        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
        <circle cx="12" cy="12" r="3"/>`;
    }
  }

  function setMsg(text, color) {
    const msg = document.getElementById('mensaje');
    msg.textContent = text;
    msg.style.color = color;
  }

  async function doLogin() {
    const control = document.getElementById('control').value.trim();
    const password = document.getElementById('password').value;
    const btn = document.getElementById('btn-login');

    if (!control || !password) {
      setMsg('Debe llenar todos los campos.', 'orange');
      return;
    }

    btn.disabled = true;
    btn.textContent = 'Verificando…';
    setMsg('', '');

    try {
      const res = await fetch('/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ N_ctrl: control, pass: password })
      });

      const data = await res.json();

      if (!data.success) {
        setMsg('Número de control o contraseña incorrectos.', 'red');
        return;
      }

      sessionStorage.setItem('rol', data.rol || 'Alumno');
      sessionStorage.setItem('N_ctrl', data.N_ctrl);
      sessionStorage.setItem('nombre', data.nombre);
      sessionStorage.setItem('apellidos', data.apellidos);
      sessionStorage.setItem('email', data.email || '');

      if (data.rol === 'Coordinador') {
        alert("Respuesta del servidor:\n" + JSON.stringify(data, null, 2));
        sessionStorage.setItem('ID_Coordinador', data.ID_Coordinador || '');
        sessionStorage.setItem('departamento', data.departamento || '');
        sessionStorage.setItem('idDepto', data.idDepto || '');
          alert("ID Coordinador guardado: " + sessionStorage.getItem("ID_Coordinador") +
          "\nRol: " + sessionStorage.getItem("rol") +
          "\nN_ctrl: " + sessionStorage.getItem("N_ctrl"));
        setMsg(`Bienvenido, ${data.nombre}`, 'green');
        setTimeout(() => window.location.href = 'coordinador/inicio_coord.html', 1200);
      } else if (data.rol === 'Docente') {
        sessionStorage.setItem('ID_Docente', data.ID_Docente || '');
        setMsg(`Bienvenido, ${data.nombre}`, 'green');
        debugger;
        setTimeout(() => window.location.href = 'maestro/home.html', 1200);
      } else {
        sessionStorage.setItem('carrera', data.carrera || '');
        sessionStorage.setItem('semestre', data.semestre || '');
        sessionStorage.setItem('foto', data.foto || '');
        setMsg(`Bienvenido, ${data.nombre}`, 'green');
        setTimeout(() => window.location.href = 'alumnos/inicio.html', 1200);
      }
    } catch {
      setMsg('Error de conexión con el servidor.', 'red');
    } finally {
      btn.disabled = false;
      btn.textContent = 'Iniciar Sesión';
    }
  }

  document.getElementById('btn-login').addEventListener('click', doLogin);

  document.getElementById('btn-support').addEventListener('click', async () => {
    setMsg('Comprobando conexión…', 'gray');

    try {
      const res = await fetch('/soporte');
      const data = await res.json();
      setMsg(
        data.conectado ? 'Base de datos conectada correctamente.' : 'No se pudo conectar a la base de datos.',
        data.conectado ? 'green' : 'red'
      );
    } catch {
      setMsg('Servidor no disponible.', 'red');
    }
  });
</script>
</body>
</html>
