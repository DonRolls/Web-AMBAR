<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gestión de Usuarios — Admin Ámbar</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--navy:#0D1B3E;--navy-mid:#1D3461;--gold:#E8A100;--gold-lt:#FFF3D0;--bg:#F0F4FA;--card:#FFFFFF;--text:#1A1F36;--text-2:#5A6488;--border:#E2E8F0;--success:#0FAF7A;--danger:#E84040;--radius:14px;--shadow:0 4px 24px rgba(13,27,62,.09)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);display:flex;flex-direction:column;height:100vh;overflow:hidden}
/* ── TOPBAR ── */
.topbar{background:var(--navy);height:58px;display:flex;align-items:center;justify-content:space-between;padding:0 24px;position:fixed;inset:0 0 auto 0;z-index:200;box-shadow:0 2px 16px rgba(0,0,0,.3)}
.topbar-left{display:flex;align-items:center;gap:16px}
.hbg{color:white;font-size:22px;cursor:pointer;width:36px;height:36px;display:flex;align-items:center;justify-content:center;border-radius:8px;transition:.2s}
.hbg:hover{background:rgba(255,255,255,.12)}
.brand{display:flex;align-items:center;gap:10px}
.brand-badge{width:36px;height:36px;background:var(--gold);border-radius:8px;display:flex;align-items:center;justify-content:center;font-family:'Outfit',sans-serif;font-size:11px;font-weight:800;color:var(--navy);line-height:1.1;text-align:center}
.brand-name{color:white;font-family:'Outfit',sans-serif;font-size:13px;font-weight:600;line-height:1.3}
.brand-name span{display:block;font-size:10px;font-weight:300;opacity:.7;letter-spacing:.6px;text-transform:uppercase}
.topbar-right{display:flex;align-items:center;gap:12px}
.rol-tag{background:rgba(232,161,0,.2);border:1px solid rgba(232,161,0,.4);color:var(--gold);font-size:11px;font-weight:600;padding:4px 10px;border-radius:20px;letter-spacing:.4px;text-transform:uppercase}
.avatar{width:34px;height:34px;background:var(--gold);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;cursor:pointer;font-weight:700;color:var(--navy)}
.logout-btn{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);color:rgba(255,255,255,.8);font-size:12px;padding:6px 12px;border-radius:8px;cursor:pointer;transition:.2s}
.logout-btn:hover{background:rgba(255,255,255,.15);color:white}
/* ── LAYOUT ── */
.layout{display:flex;margin-top:58px;height:calc(100vh - 58px);overflow:hidden}
#main-sidebar{width:235px;background:var(--navy);display:flex;flex-direction:column;flex-shrink:0}
.main{flex:1;overflow-y:auto;padding:28px 32px;background:var(--bg)}
/* ── PAGE HEADER ── */
.breadcrumb{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text-2);margin-bottom:8px}
.breadcrumb span{color:var(--gold);font-weight:600}
.page-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px;flex-wrap:wrap;gap:16px}
.page-header h1{font-family:'Outfit',sans-serif;font-size:26px;font-weight:700;color:var(--navy);letter-spacing:-.3px}
/* ── TABS ── */
.tabs{display:flex;gap:4px;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:5px;margin-bottom:22px;width:fit-content;box-shadow:var(--shadow)}
.tab-btn{padding:8px 20px;border-radius:8px;border:none;font-family:'DM Sans',sans-serif;font-size:13px;font-weight:500;cursor:pointer;color:var(--text-2);background:transparent;transition:.18s}
.tab-btn.active{background:var(--navy);color:white;font-weight:600}
/* ── TOOLBAR ── */
.toolbar{display:flex;gap:12px;margin-bottom:18px;flex-wrap:wrap;align-items:center}
.search-input{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:9px 14px;font-size:13px;font-family:'DM Sans',sans-serif;width:260px;outline:none;transition:.18s}
.search-input:focus{border-color:var(--gold)}
.btn-primary{background:var(--navy);color:white;border:none;padding:9px 18px;border-radius:10px;font-weight:600;font-size:13px;cursor:pointer;display:inline-flex;align-items:center;gap:7px;transition:.2s;font-family:'DM Sans',sans-serif}
.btn-primary:hover{background:var(--navy-mid);transform:translateY(-1px)}
/* ── TABLE ── */
.table-container{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);overflow-x:auto;box-shadow:var(--shadow)}
table{width:100%;border-collapse:collapse}
th,td{padding:14px 16px;text-align:left;border-bottom:1px solid var(--border);font-size:13px}
th{background:#F8FAFE;font-weight:600;color:var(--navy);font-size:11.5px;text-transform:uppercase;letter-spacing:.5px;white-space:nowrap}
tr:last-child td{border-bottom:none}
tr:hover td{background:#FAFBFF}
.badge{padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600}
.badge-vigente{background:#ECFDF5;color:#059669}
.badge-baja{background:#FEF2F2;color:#DC2626}
/* ── ACCIONES ── */
.btn-edit{background:#EAB308;color:white;border:none;padding:5px 13px;border-radius:7px;font-size:12px;font-weight:500;cursor:pointer;font-family:'DM Sans',sans-serif;transition:.15s}
.btn-edit:hover{background:#CA9A07}
.btn-delete{background:var(--danger);color:white;border:none;padding:5px 13px;border-radius:7px;font-size:12px;font-weight:500;cursor:pointer;font-family:'DM Sans',sans-serif;transition:.15s;margin-left:6px}
.btn-delete:hover{background:#C03030}
/* ── EMPTY STATE ── */
.empty-state{text-align:center;padding:56px 0;color:var(--text-2)}
.empty-state .icon{font-size:40px;margin-bottom:12px}
.empty-state p{font-size:14px}
/* ── MODAL ── */
.modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.45);justify-content:center;align-items:center;z-index:1000}
.modal.open{display:flex}
.modal-content{background:var(--card);border-radius:var(--radius);padding:30px;width:90%;max-width:520px;animation:fadeUp .25s ease;max-height:90vh;overflow-y:auto}
.modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}
.modal-header h2{font-family:'Outfit',sans-serif;font-size:20px;font-weight:700;color:var(--navy)}
.close-modal{font-size:26px;cursor:pointer;color:var(--text-2);line-height:1}
.close-modal:hover{color:var(--text)}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.form-group{margin-bottom:16px}
.form-group label{display:block;font-size:11px;font-weight:600;color:var(--text-2);margin-bottom:5px;text-transform:uppercase;letter-spacing:.5px}
.form-group input,.form-group select{width:100%;padding:9px 13px;border:1px solid var(--border);border-radius:9px;font-family:'DM Sans',sans-serif;font-size:13px;outline:none;transition:.18s}
.form-group input:focus,.form-group select:focus{border-color:var(--gold)}
.form-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:20px}
.btn-cancel{background:var(--border);color:var(--text-2);border:none;padding:9px 18px;border-radius:9px;cursor:pointer;font-family:'DM Sans',sans-serif;font-size:13px;font-weight:500}
.btn-cancel:hover{background:#D5DBE8}
/* ── TOAST ── */
.toast{position:fixed;bottom:28px;right:28px;background:var(--navy);color:white;padding:13px 20px;border-radius:10px;font-size:13px;font-weight:500;z-index:9999;opacity:0;transform:translateY(10px);transition:.3s;pointer-events:none}
.toast.show{opacity:1;transform:translateY(0)}
.toast.error{background:var(--danger)}
.toast.success{background:var(--success)}
/* ── LOADER ── */
.loader{text-align:center;padding:48px;color:var(--text-2);font-size:13px}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
</style>
</head>
<body>
 
<!-- TOPBAR -->
<header class="topbar">
  <div class="topbar-left">
    <span class="hbg" onclick="toggleSidebar()">☰</span>
    <div class="brand">
      <div class="brand-badge">TEC<br>NM</div>
      <div class="brand-name">Tecnológico Nacional de México<span>Portal Administrador</span></div>
    </div>
  </div>
  <div class="topbar-right">
    <span class="rol-tag">Administrador</span>
    <div class="avatar">👤</div>
    <button class="logout-btn" id="btn-logout">Cerrar sesión</button>
  </div>
</header>
 
<!-- LAYOUT -->
<div class="layout">
  <div id="main-sidebar">
    <div id="sidebar-container" style="display:flex;flex-direction:column;height:100%"></div>
  </div>
  <script src="sidebaradmi.js"></script>
 
  <main class="main">
    <div class="breadcrumb">Portal Administrador <span>›</span> <span>Gestión de Usuarios</span></div>
    <div class="page-header">
      <h1><span style="color:var(--gold);">👥</span> Gestión de Usuarios</h1>
      <button class="btn-primary" onclick="abrirModalNuevo()">
        <span>+</span> Nuevo Usuario
      </button>
    </div>
 
    <!-- TABS -->
    <div class="tabs">
      <button class="tab-btn active" onclick="cambiarTab('alumnos', this)">🎓 Alumnos</button>
      <button class="tab-btn" onclick="cambiarTab('docentes', this)">👨‍🏫 Docentes</button>
      <button class="tab-btn" onclick="cambiarTab('coordinadores', this)">🏛️ Coordinadores</button>
    </div>
 
    <!-- TOOLBAR -->
    <div class="toolbar">
      <input type="text" class="search-input" id="busqueda" placeholder="Buscar por nombre, matrícula..." oninput="filtrar()">
    </div>
 
    <!-- TABLA -->
    <div class="table-container">
      <table>
        <thead id="tabla-head"></thead>
        <tbody id="tabla-body"><tr><td colspan="10" class="loader">Cargando...</td></tr></tbody>
      </table>
    </div>
  </main>
</div>
 
<!-- MODAL USUARIO -->
<div id="modal-usuario" class="modal">
  <div class="modal-content">
    <div class="modal-header">
      <h2 id="modal-titulo">Nuevo Alumno</h2>
      <span class="close-modal" onclick="cerrarModal()">&times;</span>
    </div>
 
    <!-- Campos comunes -->
    <div class="form-row">
      <div class="form-group"><label>N° Control / Clave</label><input type="text" id="f-nctrl" placeholder="Ej: 21212680"></div>
      <div class="form-group"><label>Contraseña</label><input type="password" id="f-pass" placeholder="••••••••"></div>
    </div>
    <div class="form-row">
      <div class="form-group"><label>Nombre(s)</label><input type="text" id="f-nombre"></div>
      <div class="form-group"><label>Apellidos</label><input type="text" id="f-apellidos"></div>
    </div>
    <div class="form-group"><label>Correo Electrónico</label><input type="email" id="f-email"></div>
 
    <!-- Campos alumno -->
    <div id="campos-alumno">
      <div class="form-row">
        <div class="form-group"><label>Carrera</label>
          <select id="f-carrera">
            <option value="">Seleccionar…</option>
            <option value="1">ISC – Ing. Sistemas</option>
            <option value="2">IINF – Ing. Informática</option>
            <option value="3">IElec – Ing. Electrónica</option>
            <option value="4">IIA – Ing. Industrial</option>
          </select>
        </div>
        <div class="form-group"><label>Semestre</label>
          <select id="f-semestre">
            <option value="1">1°</option><option value="2">2°</option>
            <option value="3">3°</option><option value="4">4°</option>
            <option value="5">5°</option><option value="6">6°</option>
            <option value="7">7°</option><option value="8">8°</option>
            <option value="9">9°</option><option value="10">10°</option>
          </select>
        </div>
      </div>
      <div class="form-group"><label>Estatus</label>
        <select id="f-estatus">
          <option value="VIGENTE">VIGENTE</option>
          <option value="BAJA">BAJA</option>
          <option value="EGRESADO">EGRESADO</option>
        </select>
      </div>
    </div>
 
    <!-- Campos coordinador -->
    <div id="campos-coordinador" style="display:none">
      <div class="form-group"><label>Departamento</label>
        <select id="f-departamento">
          <option value="1">Sistemas y Computación</option>
          <option value="2">Ingeniería Industrial</option>
          <option value="3">Ciencias Básicas</option>
        </select>
      </div>
    </div>
 
    <div class="form-actions">
      <button class="btn-cancel" onclick="cerrarModal()">Cancelar</button>
      <button class="btn-primary" onclick="guardarUsuario()">💾 Guardar</button>
    </div>
  </div>
</div>
 
<!-- TOAST -->
<div id="toast" class="toast"></div>
 
<script>
/* ═══════════════════════════════════════════════════
   ESTADO GLOBAL
═══════════════════════════════════════════════════ */
const API = '/admin';
const HEADERS = () => ({
  'Content-Type': 'application/json',
  'x-admin-id': sessionStorage.getItem('ID_Administrador') || '1'
});
 
let tabActual = 'alumnos';
let usuarios   = [];      // datos cargados del servidor
let editandoId = null;    // null = nuevo, string/int = editar
 
/* ─── Auth ─── */
(function() {
  const id = sessionStorage.getItem('ID_Administrador');
  if (!id) window.location.href = '/login.html';
  document.getElementById('btn-logout').addEventListener('click', () => {
    sessionStorage.clear(); window.location.href = '/login.html';
  });
})();
 
/* ═══════════════════════════════════════════════════
   TABS
═══════════════════════════════════════════════════ */
function cambiarTab(tab, btn) {
  tabActual = tab;
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('busqueda').value = '';
  cargarUsuarios();
}
 
/* ═══════════════════════════════════════════════════
   CABECERAS DE TABLA POR TIPO
═══════════════════════════════════════════════════ */
const COLUMNAS = {
  alumnos:      ['N° Control','Nombre','Apellidos','Email','Carrera','Semestre','Estatus','Acciones'],
  docentes:     ['ID','N° Control','Nombre','Apellidos','Email','Acciones'],
  coordinadores:['ID','N° Control','Nombre','Apellidos','Email','Departamento','Acciones'],
};
 
function renderCabecera() {
  const cols = COLUMNAS[tabActual];
  document.getElementById('tabla-head').innerHTML =
    '<tr>' + cols.map(c => `<th>${c}</th>`).join('') + '</tr>';
}
 
/* ═══════════════════════════════════════════════════
   CARGA DE DATOS
═══════════════════════════════════════════════════ */
async function cargarUsuarios() {
  renderCabecera();
  const tbody = document.getElementById('tabla-body');
  tbody.innerHTML = '<tr><td colspan="10" class="loader">Cargando…</td></tr>';
 
  const endpoint = `${API}/${tabActual}`;
  try {
    const res = await fetch(endpoint, { headers: HEADERS() });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    usuarios = await res.json();
    renderTabla(usuarios);
  } catch (e) {
    console.error(e);
    tbody.innerHTML = `<tr><td colspan="10" class="empty-state">
      <div class="icon">⚠️</div>
      <p>No se pudo conectar al servidor.<br><small>${e.message}</small></p>
    </td></tr>`;
    toast('Error al cargar datos: ' + e.message, 'error');
  }
}
 
/* ═══════════════════════════════════════════════════
   RENDER TABLA
═══════════════════════════════════════════════════ */
function renderTabla(data) {
  const tbody = document.getElementById('tabla-body');
  if (!data.length) {
    const cols = COLUMNAS[tabActual].length;
    tbody.innerHTML = `<tr><td colspan="${cols}" class="empty-state">
      <div class="icon">🔍</div><p>No hay registros</p></td></tr>`;
    return;
  }
 
  tbody.innerHTML = data.map(u => {
    if (tabActual === 'alumnos') {
      const badge = u.Estatus === 'VIGENTE'
        ? '<span class="badge badge-vigente">VIGENTE</span>'
        : '<span class="badge badge-baja">' + (u.Estatus||'—') + '</span>';
      return `<tr>
        <td><strong>${u.N_ctrl}</strong></td>
        <td>${u.Nombre}</td>
        <td>${u.Apellidos}</td>
        <td>${u.Email}</td>
        <td>${u.Carrera || u.id_carrera}</td>
        <td>${u.Semestre}°</td>
        <td>${badge}</td>
        <td>
          <button class="btn-edit" onclick="editarUsuario('${u.N_ctrl}')">✏️ Editar</button>
          <button class="btn-delete" onclick="eliminarUsuario('${u.N_ctrl}')">🗑</button>
        </td>
      </tr>`;
    }
    if (tabActual === 'docentes') {
      return `<tr>
        <td>${u.ID_Docente}</td>
        <td>${u.N_ctrl || '—'}</td>
        <td>${u.Nombre}</td>
        <td>${u.Apellidos}</td>
        <td>${u.Email || '—'}</td>
        <td>
          <button class="btn-edit" onclick="editarUsuario(${u.ID_Docente})">✏️ Editar</button>
          <button class="btn-delete" onclick="eliminarUsuario(${u.ID_Docente})">🗑</button>
        </td>
      </tr>`;
    }
    if (tabActual === 'coordinadores') {
      return `<tr>
        <td>${u.ID_Coordinador}</td>
        <td>${u.N_ctrl}</td>
        <td>${u.Nombre}</td>
        <td>${u.Apellidos}</td>
        <td>${u.Email}</td>
        <td>${u.Departamento || u.ID_Departamento}</td>
        <td>
          <button class="btn-edit" onclick="editarUsuario('${u.N_ctrl}')">✏️ Editar</button>
          <button class="btn-delete" onclick="eliminarUsuario('${u.N_ctrl}')">🗑</button>
        </td>
      </tr>`;
    }
  }).join('');
}
 
/* ═══════════════════════════════════════════════════
   FILTRO LOCAL
═══════════════════════════════════════════════════ */
function filtrar() {
  const q = document.getElementById('busqueda').value.toLowerCase();
  const filtrado = usuarios.filter(u =>
    Object.values(u).some(v => String(v).toLowerCase().includes(q))
  );
  renderTabla(filtrado);
}
 
/* ═══════════════════════════════════════════════════
   MODAL — ABRIR / CERRAR
═══════════════════════════════════════════════════ */
const TIPO_LABEL = { alumnos: 'Alumno', docentes: 'Docente', coordinadores: 'Coordinador' };
 
function abrirModalNuevo() {
  editandoId = null;
  resetForm();
  document.getElementById('modal-titulo').textContent = `Nuevo ${TIPO_LABEL[tabActual]}`;
  document.getElementById('f-pass').required = true;
  mostrarCamposTipo();
  document.getElementById('modal-usuario').classList.add('open');
}
 
function editarUsuario(id) {
  editandoId = id;
  const u = usuarios.find(u => (u.N_ctrl == id || u.ID_Docente == id));
  if (!u) { toast('Usuario no encontrado', 'error'); return; }
 
  resetForm();
  document.getElementById('modal-titulo').textContent = `Editar ${TIPO_LABEL[tabActual]}`;
  document.getElementById('f-nctrl').value   = u.N_ctrl  || '';
  document.getElementById('f-nombre').value  = u.Nombre  || '';
  document.getElementById('f-apellidos').value = u.Apellidos || '';
  document.getElementById('f-email').value   = u.Email   || '';
  document.getElementById('f-nctrl').disabled = true; // no cambiar PK en edición
 
  if (tabActual === 'alumnos') {
    document.getElementById('f-carrera').value  = u.id_carrera || '';
    document.getElementById('f-semestre').value = u.Semestre   || 1;
    document.getElementById('f-estatus').value  = u.Estatus    || 'VIGENTE';
  }
  if (tabActual === 'coordinadores') {
    document.getElementById('f-departamento').value = u.ID_Departamento || 1;
  }
 
  mostrarCamposTipo();
  document.getElementById('modal-usuario').classList.add('open');
}
 
function cerrarModal() {
  document.getElementById('modal-usuario').classList.remove('open');
  document.getElementById('f-nctrl').disabled = false;
}
 
function resetForm() {
  ['f-nctrl','f-pass','f-nombre','f-apellidos','f-email'].forEach(id => {
    const el = document.getElementById(id);
    el.value = '';
    el.disabled = false;
  });
  document.getElementById('f-carrera').value    = '';
  document.getElementById('f-semestre').value   = '1';
  document.getElementById('f-estatus').value    = 'VIGENTE';
  document.getElementById('f-departamento').value = '1';
}
 
function mostrarCamposTipo() {
  document.getElementById('campos-alumno').style.display       = tabActual === 'alumnos'       ? '' : 'none';
  document.getElementById('campos-coordinador').style.display  = tabActual === 'coordinadores' ? '' : 'none';
}
 
/* ═══════════════════════════════════════════════════
   GUARDAR (POST / PUT)
═══════════════════════════════════════════════════ */
async function guardarUsuario() {
  const nctrl     = document.getElementById('f-nctrl').value.trim();
  const pass      = document.getElementById('f-pass').value.trim();
  const nombre    = document.getElementById('f-nombre').value.trim();
  const apellidos = document.getElementById('f-apellidos').value.trim();
  const email     = document.getElementById('f-email').value.trim();
 
  if (!nombre || !apellidos || !email) { toast('Completa todos los campos requeridos', 'error'); return; }
  if (!editandoId && !pass) { toast('La contraseña es obligatoria para nuevos usuarios', 'error'); return; }
  if (!editandoId && !nctrl) { toast('El N° de control es obligatorio', 'error'); return; }
 
  let body = { Nombre: nombre, Apellidos: apellidos, Email: email };
  if (pass) body.Pass = pass;
 
  if (tabActual === 'alumnos') {
    body.id_carrera = parseInt(document.getElementById('f-carrera').value);
    body.Semestre   = parseInt(document.getElementById('f-semestre').value);
    body.Estatus    = document.getElementById('f-estatus').value;
  }
  if (tabActual === 'coordinadores') {
    body.ID_Departamento = parseInt(document.getElementById('f-departamento').value);
  }
 
  let url, method;
  if (editandoId) {
    method = 'PUT';
    if (tabActual === 'alumnos' || tabActual === 'coordinadores')
      url = `${API}/${tabActual}/${editandoId}`;
    else
      url = `${API}/${tabActual}/${editandoId}`;
  } else {
    method = 'POST';
    url = `${API}/${tabActual}`;
    body.N_ctrl = nctrl;
  }
 
  try {
    const res = await fetch(url, { method, headers: HEADERS(), body: JSON.stringify(body) });
    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      throw new Error(err.error || `HTTP ${res.status}`);
    }
    cerrarModal();
    toast(editandoId ? 'Usuario actualizado ✓' : 'Usuario creado ✓', 'success');
    cargarUsuarios();
  } catch (e) {
    toast('Error al guardar: ' + e.message, 'error');
  }
}
 
/* ═══════════════════════════════════════════════════
   ELIMINAR
═══════════════════════════════════════════════════ */
async function eliminarUsuario(id) {
  if (!confirm(`¿Eliminar este ${TIPO_LABEL[tabActual].toLowerCase()}?\nEsta acción no se puede deshacer.`)) return;
 
  const url = tabActual === 'docentes'
    ? `${API}/${tabActual}/${id}`
    : `${API}/${tabActual}/${id}`;
 
  try {
    const res = await fetch(url, { method: 'DELETE', headers: HEADERS() });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    toast(`${TIPO_LABEL[tabActual]} eliminado`, 'success');
    cargarUsuarios();
  } catch (e) {
    toast('Error al eliminar: ' + e.message, 'error');
  }
}
 
/* ═══════════════════════════════════════════════════
   TOAST
═══════════════════════════════════════════════════ */
function toast(msg, tipo = '') {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast ' + tipo;
  void el.offsetWidth;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 3200);
}
 
/* ─── Init ─── */
cargarUsuarios();
</script>
