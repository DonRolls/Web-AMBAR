<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Admin – Ámbar</title>
  <style>
    body { font-family: Arial, sans-serif; background: #F0F4FA; display: flex; align-items: center; justify-content: center; height: 100vh; }
    .card { background: white; padding: 2rem; border-radius: 10px; box-shadow: 0 4px 24px rgba(0,0,0,.1); text-align: center; }
    a { display: inline-block; margin: 10px 0; color: #1B396A; text-decoration: none; font-weight: bold; }
  </style>
</head>
<body>
<div class="card">
  <h1>Panel de Administración</h1>
  <p>Bienvenido, <span id="admin-nombre"></span></p>
  <a href="usuarios.html">👥 Gestionar Usuarios</a><br>
  <a href="editarmateria.html">📚 Gestionar Materias</a><br>
  <a href="#" id="logout">Cerrar sesión</a>
</div>
<script src="../session.js"></script>
<script>
  const id = sessionStorage.getItem('ID_Administrador');
  if (!id) window.location.href = '/login.html';
  document.getElementById('admin-nombre').textContent = sessionStorage.getItem('nombre') || '';
  document.getElementById('logout').addEventListener('click', () => {
    sessionStorage.clear();
    window.location.href = '/login.html';
  });
</script>
</body>
</html>
