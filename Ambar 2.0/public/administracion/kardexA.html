<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kárdex — Coordinador TecNM</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--navy:#0D1B3E;--navy-mid:#1D3461;--gold:#E8A100;--gold-lt:#FFF3D0;--gold-glow:rgba(232,161,0,.18);--bg:#F0F4FA;--card:#FFFFFF;--text:#1A1F36;--text-2:#5A6488;--border:#E2E8F0;--success:#0FAF7A;--danger:#E84040;--radius:14px;--shadow:0 4px 24px rgba(13,27,62,.09);--shadow-md:0 8px 40px rgba(13,27,62,.14)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);display:flex;flex-direction:column;height:100vh;overflow:hidden}
.topbar{background:var(--navy);height:58px;display:flex;align-items:center;justify-content:space-between;padding:0 24px;position:fixed;inset:0 0 auto 0;z-index:200;box-shadow:0 2px 16px rgba(0,0,0,.3)}
.topbar-left{display:flex;align-items:center;gap:16px}
.hbg{color:white;font-size:22px;cursor:pointer;width:36px;height:36px;display:flex;align-items:center;justify-content:center;border-radius:8px;transition:.2s}
.hbg:hover{background:rgba(255,255,255,.12)}
.brand{display:flex;align-items:center;gap:10px}
.brand-badge{width:36px;height:36px;background:var(--gold);border-radius:8px;display:flex;align-items:center;justify-content:center;font-family:'Outfit',sans-serif;font-size:11px;font-weight:800;color:var(--navy);line-height:1.1;text-align:center}
.brand-name{color:white;font-family:'Outfit',sans-serif;font-size:13px;font-weight:600;line-height:1.3}
.brand-name span{display:block;font-size:10px;font-weight:300;opacity:.7;letter-spacing:.6px;text-transform:uppercase}
.topbar-right{display:flex;align-items:center;gap:12px}
.rol-tag{background:rgba(232,161,0,.2);border:1px solid rgba(232,161,0,.4);color:var(--gold);font-size:11px;font-weight:600;padding:4px 10px;border-radius:20px;letter-spacing:.4px;text-transform:uppercase}
.avatar{width:34px;height:34px;background:var(--gold);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;cursor:pointer;font-weight:700;color:var(--navy)}
.logout-btn{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);color:rgba(255,255,255,.8);font-size:12px;padding:6px 12px;border-radius:8px;cursor:pointer;transition:.2s}
.logout-btn:hover{background:rgba(255,255,255,.15);color:white}
.layout{display:flex;margin-top:58px;height:calc(100vh - 58px);overflow:hidden}
#main-sidebar{width:235px;background:var(--navy);display:flex;flex-direction:column;flex-shrink:0}
.main{flex:1;overflow-y:auto;padding:28px 32px;background:var(--bg)}
.breadcrumb{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text-2);margin-bottom:8px}
.breadcrumb span{color:var(--gold);font-weight:600}
.page-header{margin-bottom:22px}
.page-header h1{font-family:'Outfit',sans-serif;font-size:26px;font-weight:700;color:var(--navy);letter-spacing:-.3px}
/* Selector alumno */
.alumno-selector{background:var(--card);border-radius:var(--radius);padding:20px;margin-bottom:24px;border:1px solid var(--border);display:flex;gap:16px;align-items:flex-end;flex-wrap:wrap;box-shadow:var(--shadow)}
.alumno-selector .form-group{margin-bottom:0;flex:1}
.alumno-selector label{font-size:11px;color:var(--text-2);text-transform:uppercase;letter-spacing:.5px;font-weight:600;display:block;margin-bottom:4px}
.alumno-selector input,.alumno-selector select{width:100%;padding:10px 14px;border:1px solid var(--border);border-radius:10px}
.info-alumno{background:linear-gradient(135deg,var(--gold-lt),#FFF8E7);border-radius:var(--radius);padding:20px;margin-bottom:24px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:16px;border-left:4px solid var(--gold)}
.info-alumno-item{text-align:center}
.info-alumno-item .label{font-size:11px;color:var(--text-2);text-transform:uppercase;letter-spacing:.5px;font-weight:600}
.info-alumno-item .value{font-size:18px;font-weight:800;color:var(--navy)}
.btn-primary{background:var(--navy);color:white;border:none;padding:10px 20px;border-radius:12px;font-weight:600;font-size:13px;cursor:pointer;display:inline-flex;align-items:center;gap:8px;transition:.2s}
.btn-primary:hover{background:var(--navy-mid)}
.btn-edit{background:#EAB308;color:white;border:none;padding:6px 14px;border-radius:8px;font-size:12px;font-weight:500;cursor:pointer;margin-right:6px}
.btn-delete{background:var(--danger);color:white;border:none;padding:6px 14px;border-radius:8px;font-size:12px;font-weight:500;cursor:pointer}
.table-container{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);overflow-x:auto;margin-top:16px;box-shadow:var(--shadow)}
table{width:100%;border-collapse:collapse}
th,td{padding:14px 16px;text-align:left;border-bottom:1px solid var(--border);font-size:13px}
th{background:#F8FAFE;font-weight:600;color:var(--navy);font-size:12px;text-transform:uppercase;letter-spacing:.5px}
.badge-aprobado{background:#ECFDF5;color:#059669;padding:4px 12px;border-radius:20px;font-size:11px;font-weight:600}
.badge-reprobado{background:#FEF2F2;color:#DC2626;padding:4px 12px;border-radius:20px;font-size:11px;font-weight:600}
.modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);justify-content:center;align-items:center;z-index:1000}
.modal-content{background:var(--card);border-radius:var(--radius);padding:28px;width:90%;max-width:500px}
.modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}
.modal-header h2{font-family:'Outfit',sans-serif;font-size:20px;font-weight:700;color:var(--navy)}
.close-modal{font-size:28px;cursor:pointer;color:var(--text-2)}
.form-group{margin-bottom:18px}
.form-group label{display:block;font-size:12px;font-weight:600;color:var(--text-2);margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px}
.form-group input,.form-group select{width:100%;padding:10px 14px;border:1px solid var(--border);border-radius:10px}
.form-actions{display:flex;justify-content:flex-end;gap:12px;margin-top:24px}
.btn-cancel{background:var(--border);color:var(--text-2);border:none;padding:10px 20px;border-radius:10px;cursor:pointer}
</style>
</head>
<body>
<header class="topbar"><div class="topbar-left"><span class="hbg" onclick="toggleSidebar()">☰</span><div class="brand"><div class="brand-badge">TEC<br>NM</div><div class="brand-name">Tecnológico Nacional de México<span>Portal Estudiantes</span></div></div></div><div class="topbar-right"><span class="rol-tag">Coordinador</span><div class="avatar">👤</div><button class="logout-btn" onclick="location.href='login.html'">Cerrar sesión</button></div></header>
<div class="layout"><div id="main-sidebar"><div id="sidebar-container" style="display:flex;flex-direction:column;height:100%"></div></div><script src="sidebaradmi.js"></script>
<main class="main"><div class="breadcrumb">Portal Coordinador <span>›</span> <span>Kárdex</span></div><div class="page-header"><h1><span style="color:var(--gold);">🎓</span> Kárdex de Alumnos</h1></div>
<div class="alumno-selector"><div class="form-group"><label>Buscar alumno</label><input type="text" id="buscar-alumno" placeholder="Matrícula o nombre..."></div><div class="form-group"><label>Carrera</label><select id="filtro-carrera"><option>Todas</option><option>ING. INFORMÁTICA</option><option>ING. SISTEMAS</option></select></div><button class="btn-primary" onclick="buscarAlumno()">🔍 Buscar</button></div>
<div id="info-alumno" class="info-alumno" style="display:none;"><div class="info-alumno-item"><div class="label">Matrícula</div><div class="value" id="alumno-matricula">-</div></div><div class="info-alumno-item"><div class="label">Nombre</div><div class="value" id="alumno-nombre">-</div></div><div class="info-alumno-item"><div class="label">Carrera</div><div class="value" id="alumno-carrera">-</div></div><div class="info-alumno-item"><div class="label">Semestre</div><div class="value" id="alumno-semestre">-</div></div><div class="info-alumno-item"><div class="label">Promedio</div><div class="value" id="alumno-promedio">-</div></div></div>
<div style="display:flex;justify-content:flex-end;margin-bottom:16px;"><button class="btn-primary" onclick="abrirModalCalificacion()" id="btn-agregar-calif" style="display:none;"><span>+</span> Agregar Calificación</button></div>
<div class="table-container"><table><thead><tr><th>Periodo</th><th>Materia</th><th>Clave</th><th>Créditos</th><th>Calificación</th><th>Tipo</th><th>Estado</th><th>Acciones</th></tr></thead><tbody id="tabla-calificaciones"><tr><td colspan="8" style="text-align:center;padding:40px;">Seleccione un alumno para ver su kárdex</td></tr></tbody></table></div></main></div>
<div id="modalCalificacion" class="modal"><div class="modal-content"><div class="modal-header"><h2 id="modalTitulo">Agregar Calificación</h2><span class="close-modal" onclick="cerrarModalCalif()">&times;</span></div>
<form id="formCalificacion"><input type="hidden" id="calif_id"><input type="hidden" id="calif_alumno_id"><div class="form-group"><label>Materia</label><select id="id_materia" required><option value="">Seleccionar materia</option></select></div><div class="form-group"><label>Periodo</label><input type="text" id="periodo" placeholder="Ej: 2024-1" required></div><div class="form-group"><label>Calificación</label><input type="number" id="calificacion" step="0.1" min="0" max="10" required></div><div class="form-group"><label>Tipo</label><select id="ordinario"><option value="1">Ordinario</option><option value="0">Extraordinario</option></select></div><div class="form-actions"><button type="button" class="btn-cancel" onclick="cerrarModalCalif()">Cancelar</button><button type="submit" class="btn-primary">Guardar</button></div></form></div></div>
<script>let alumnoSeleccionado=null;
function toggleSidebar(){const s=document.getElementById('main-sidebar');if(s)s.classList.toggle('collapsed')}
function buscarAlumno(){/* Fetch para buscar alumno */}
function abrirModalCalificacion(){if(alumnoSeleccionado){document.getElementById('calif_alumno_id').value=alumnoSeleccionado.id;document.getElementById('modalCalificacion').style.display='flex'}}
function cerrarModalCalif(){document.getElementById('modalCalificacion').style.display='none'}
function cargarMateriasSelect(){/* Cargar materias en select */}
function guardarCalificacion(e){e.preventDefault();/* POST/PUT */}
function editarCalificacion(id){/* Cargar datos al modal */}
function eliminarCalificacion(id){if(confirm('¿Eliminar esta calificación?')){/* DELETE */}}
document.getElementById('formCalificacion').addEventListener('submit',guardarCalificacion);cargarMateriasSelect();</script>
</body>
</html>
