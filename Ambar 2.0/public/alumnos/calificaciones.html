<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calificaciones — Portal Estudiante TecNM</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--navy:#0D1B3E;--navy-mid:#1D3461;--gold:#E8A100;--gold-lt:#FFF3D0;--gold-glow:rgba(232,161,0,.18);--bg:#F0F4FA;--card:#FFFFFF;--text:#1A1F36;--text-2:#5A6488;--border:#E2E8F0;--success:#0FAF7A;--danger:#E84040;--radius:14px;--shadow:0 4px 24px rgba(13,27,62,.09);--shadow-md:0 8px 40px rgba(13,27,62,.14)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);display:flex;flex-direction:column;height:100vh;overflow:hidden}
.topbar{background:var(--navy);height:58px;display:flex;align-items:center;justify-content:space-between;padding:0 24px;position:fixed;inset:0 0 auto 0;z-index:200;box-shadow:0 2px 16px rgba(0,0,0,.3)}
.topbar-left{display:flex;align-items:center;gap:16px}
.hbg{color:white;font-size:22px;cursor:pointer;width:36px;height:36px;display:flex;align-items:center;justify-content:center;border-radius:8px;transition:.2s}
.hbg:hover{background:rgba(255,255,255,.12)}
.brand{display:flex;align-items:center;gap:10px}
.brand-badge{width:36px;height:36px;background:var(--gold);border-radius:8px;display:flex;align-items:center;justify-content:center;font-family:'Outfit',sans-serif;font-size:11px;font-weight:800;color:var(--navy);line-height:1.1;text-align:center}
.brand-name{color:white;font-family:'Outfit',sans-serif;font-size:13px;font-weight:600;line-height:1.3}
.brand-name span{display:block;font-size:10px;font-weight:300;opacity:.7;letter-spacing:.6px;text-transform:uppercase}
.topbar-right{display:flex;align-items:center;gap:12px}
.stu-tag{background:rgba(59,130,246,.25);border:1px solid rgba(59,130,246,.5);color:#93C5FD;font-size:11px;font-weight:600;padding:4px 10px;border-radius:20px;letter-spacing:.4px;text-transform:uppercase}
.avatar{width:34px;height:34px;background:var(--gold);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;cursor:pointer;font-weight:700;color:var(--navy)}
.logout-btn{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);color:rgba(255,255,255,.8);font-size:12px;padding:6px 12px;border-radius:8px;cursor:pointer;transition:.2s;font-family:'DM Sans',sans-serif}
.logout-btn:hover{background:rgba(255,255,255,.15);color:white}
.layout{display:flex;margin-top:58px;height:calc(100vh - 58px);overflow:hidden}
#main-sidebar{width:235px;background:var(--navy);display:flex;flex-direction:column;flex-shrink:0}
.main{flex:1;overflow-y:auto;padding:28px 32px;background:var(--bg)}
.breadcrumb{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text-2);margin-bottom:8px}
.breadcrumb span{color:var(--gold);font-weight:600}
.page-header{margin-bottom:22px;animation:fadeUp .5s ease both}
.page-header h1{font-family:'Outfit',sans-serif;font-size:26px;font-weight:700;color:var(--navy);letter-spacing:-.3px}
/* BOLETA BAR */
.boleta-bar{display:flex;align-items:center;gap:14px;margin-bottom:28px;flex-wrap:wrap;animation:fadeUp .5s ease .05s both;max-width:780px}
.periodo-wrap{flex:1;min-width:200px;position:relative;background:var(--card);border:1.5px solid var(--border);border-radius:10px;transition:.15s}
.periodo-wrap:focus-within{border-color:var(--gold);box-shadow:0 0 0 3px var(--gold-glow)}
.periodo-wrap label{position:absolute;top:-9px;left:12px;background:var(--card);padding:0 4px;font-size:11px;color:var(--text-2);font-weight:600;letter-spacing:.4px;text-transform:uppercase}
.periodo-wrap select{width:100%;padding:13px 16px;border:none;border-radius:10px;font-size:13.5px;color:var(--text);font-family:'DM Sans',sans-serif;appearance:none;cursor:pointer;background:transparent;outline:none}
.periodo-arrow{position:absolute;right:12px;top:50%;transform:translateY(-50%);pointer-events:none;color:var(--gold)}
.btn-dl{background:var(--gold);color:var(--navy);border:none;padding:12px 20px;font-size:13px;font-weight:700;border-radius:8px;cursor:pointer;white-space:nowrap;transition:.2s;font-family:'DM Sans',sans-serif}
.btn-dl:hover{background:#d4930a;box-shadow:0 4px 14px rgba(232,161,0,.4)}
/* SECTION TITLE */
.sec-title{font-family:'Outfit',sans-serif;font-size:17px;font-weight:700;color:var(--navy);margin-bottom:14px;display:flex;align-items:center;gap:8px;animation:fadeUp .5s ease .1s both}
.sec-icon{width:28px;height:28px;border-radius:7px;background:var(--gold-lt);color:var(--gold);display:flex;align-items:center;justify-content:center;font-size:14px}
/* ACCORDION */
.acc-item{border:1px solid var(--border);border-radius:var(--radius);margin-bottom:10px;background:var(--card);overflow:hidden;box-shadow:var(--shadow);max-width:780px;animation:fadeUp .5s ease both}
.acc-item:nth-child(1){animation-delay:.12s}
.acc-item:nth-child(2){animation-delay:.16s}
.acc-item:nth-child(3){animation-delay:.2s}
.acc-item:nth-child(4){animation-delay:.24s}
.acc-header{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;background:#FAFBFF;cursor:pointer;user-select:none;transition:.15s;border-bottom:1px solid transparent}
.acc-header:hover{background:var(--gold-lt)}
.acc-header.open{background:var(--gold-lt);border-bottom-color:rgba(232,161,0,.3)}
.acc-header-title{font-size:13.5px;font-weight:700;color:var(--navy)}
.chevron{font-size:14px;color:var(--gold);transition:transform .25s;display:inline-block}
.chevron.open{transform:rotate(180deg)}
.acc-body{display:none;padding:22px 24px;border-top:1px solid var(--border)}
.acc-body.open{display:block;animation:fadeUp .3s ease both}
/* DATOS GRID */
.sub-title{font-size:13.5px;font-weight:700;color:var(--navy);margin-bottom:14px;display:flex;align-items:center;gap:6px}
.datos-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px 24px;margin-bottom:20px;font-size:13px;color:var(--text-2)}
.datos-grid span{font-weight:700;color:var(--text)}
/* HORARIO MINI */
.h-mini{width:100%;border-collapse:collapse;margin-bottom:20px;font-size:12.5px}
.h-mini th{text-align:left;padding:7px 10px;color:var(--text-2);font-weight:600;border-bottom:1px solid var(--border);font-size:11px;text-transform:uppercase;letter-spacing:.5px}
.h-mini td{padding:9px 10px;border-bottom:1px solid #F1F5FB;color:var(--text)}
.divider{border:none;border-top:1px solid var(--border);margin:18px 0}
/* BADGES CAL */
.cal-label{font-size:12px;color:var(--text-2);margin-bottom:8px;font-weight:600;text-transform:uppercase;letter-spacing:.5px}
.cal-badge{display:inline-flex;align-items:center;font-size:13px;font-weight:700;padding:5px 14px;border-radius:20px}
.cal-nc{background:#F1F5FB;color:var(--text-2)}
.cal-ok{background:#DCFCE7;color:#15803D}
.cal-re{background:#FEE2E2;color:#B91C1C}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}

/* PRINT STYLES */
@media print {
    .topbar, #main-sidebar, .breadcrumb, .boleta-bar, .logout-btn, .hbg, .periodo-arrow, .chevron { display: none !important; }
    body { background: white !important; overflow: visible !important; height: auto !important; }
    .layout { margin-top: 0 !important; height: auto !important; overflow: visible !important; display: block !important; }
    .main { padding: 0 !important; background: white !important; overflow: visible !important; }
    .acc-item { border: 1px solid #eee !important; box-shadow: none !important; break-inside: avoid; margin-bottom: 20px !important; }
    .acc-body { display: block !important; padding: 15px !important; }
    .acc-header { background: #f9f9f9 !important; border-bottom: 1px solid #eee !important; pointer-events: none; }
    .page-header h1 { font-size: 20px !important; margin-bottom: 10px !important; }
    .sec-title { font-size: 16px !important; }
    .divider { border-top: 1px solid #eee !important; }
}
</style>
</head>
<body>
<header class="topbar">
    <div class="topbar-left">
        <span class="hbg">☰</span>
        <div class="brand">
            <div class="brand-badge">TEC<br>NM</div>
            <div class="brand-name">Tecnológico Nacional de México<span>Portal Estudiantes</span></div>
        </div>
    </div>
    <div class="topbar-right">
        <span class="stu-tag">Estudiante</span>
        <div class="avatar">👤</div>
        <button class="logout-btn">Cerrar sesión</button>
    </div>
</header>

<div class="layout">
  <div id="main-sidebar"><div id="sidebar-container" style="display:flex;flex-direction:column;height:100%"></div></div>
  <script src="sidebar.js"></script>
  <main class="main">
    <div class="breadcrumb">Portal Estudiantes <span>›</span> <span>Calificaciones</span></div>
    <div class="page-header"><h1>Calificaciones</h1></div>

    <div class="boleta-bar">
      <div class="periodo-wrap">
        <label>Periodo</label>
        <select id="selectPeriodo">
          <option value="">Cargando periodos...</option>
        </select>
        <span class="periodo-arrow">▾</span>
      </div>
      <button class="btn-dl" id="btnDownloadBoleta">⬇ Descargar Boleta</button>
    </div>

    <div class="sec-title"><div class="sec-icon">📋</div>Calificaciones por materia</div>

    <div id="materias-container"></div>
  </main>
</div>
<script src="../session.js"></script>
<script src="calificaciones.js"></script>
<script>
(function() {
    // Verificación de sesión
    const nctrl = sessionStorage.getItem("N_ctrl");
    if (!nctrl) {
        window.location.href = "../login.html";
        return;
    }
    // Cerrar sesión
    document.querySelector(".logout-btn")?.addEventListener("click", () => {
        sessionStorage.clear();
        window.location.href = "../login.html";
    });
})();

</script>
</body>
</html>
