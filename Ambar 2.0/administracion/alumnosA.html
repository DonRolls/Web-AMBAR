<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alumnos — Coordinador TecNM</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--navy:#0D1B3E;--navy-mid:#1D3461;--gold:#E8A100;--gold-lt:#FFF3D0;--gold-glow:rgba(232,161,0,.18);--bg:#F0F4FA;--card:#FFFFFF;--text:#1A1F36;--text-2:#5A6488;--border:#E2E8F0;--success:#0FAF7A;--danger:#E84040;--radius:14px;--shadow:0 4px 24px rgba(13,27,62,.09);--shadow-md:0 8px 40px rgba(13,27,62,.14)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);display:flex;flex-direction:column;height:100vh;overflow:hidden}
.topbar{background:var(--navy);height:58px;display:flex;align-items:center;justify-content:space-between;padding:0 24px;position:fixed;inset:0 0 auto 0;z-index:200;box-shadow:0 2px 16px rgba(0,0,0,.3)}
.topbar-left{display:flex;align-items:center;gap:16px}
.hbg{color:white;font-size:22px;cursor:pointer;width:36px;height:36px;display:flex;align-items:center;justify-content:center;border-radius:8px;transition:.2s}
.hbg:hover{background:rgba(255,255,255,.12)}
.brand{display:flex;align-items:center;gap:10px}
.brand-badge{width:36px;height:36px;background:var(--gold);border-radius:8px;display:flex;align-items:center;justify-content:center;font-family:'Outfit',sans-serif;font-size:11px;font-weight:800;color:var(--navy);line-height:1.1;text-align:center}
.brand-name{color:white;font-family:'Outfit',sans-serif;font-size:13px;font-weight:600;line-height:1.3}
.brand-name span{display:block;font-size:10px;font-weight:300;opacity:.7;letter-spacing:.6px;text-transform:uppercase}
.topbar-right{display:flex;align-items:center;gap:12px}
.rol-tag{background:rgba(232,161,0,.2);border:1px solid rgba(232,161,0,.4);color:var(--gold);font-size:11px;font-weight:600;padding:4px 10px;border-radius:20px;letter-spacing:.4px;text-transform:uppercase}
.avatar{width:34px;height:34px;background:var(--gold);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;cursor:pointer;font-weight:700;color:var(--navy)}
.logout-btn{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);color:rgba(255,255,255,.8);font-size:12px;padding:6px 12px;border-radius:8px;cursor:pointer;transition:.2s}
.logout-btn:hover{background:rgba(255,255,255,.15);color:white}
.layout{display:flex;margin-top:58px;height:calc(100vh - 58px);overflow:hidden}
#main-sidebar{width:235px;background:var(--navy);display:flex;flex-direction:column;flex-shrink:0}
.main{flex:1;overflow-y:auto;padding:28px 32px;background:var(--bg)}
.breadcrumb{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text-2);margin-bottom:8px}
.breadcrumb span{color:var(--gold);font-weight:600}
.page-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px;flex-wrap:wrap;gap:16px}
.page-header h1{font-family:'Outfit',sans-serif;font-size:26px;font-weight:700;color:var(--navy);letter-spacing:-.3px}
/* Botones */
.btn-primary{background:var(--navy);color:white;border:none;padding:10px 20px;border-radius:12px;font-weight:600;font-size:13px;cursor:pointer;display:flex;align-items:center;gap:8px;transition:.2s}
.btn-primary:hover{background:var(--navy-mid);transform:translateY(-1px)}
.btn-edit{background:#EAB308;color:white;border:none;padding:6px 14px;border-radius:8px;font-size:12px;font-weight:500;cursor:pointer;margin-right:6px;transition:.2s}
.btn-edit:hover{background:#CA8A04}
.btn-delete{background:var(--danger);color:white;border:none;padding:6px 14px;border-radius:8px;font-size:12px;font-weight:500;cursor:pointer;transition:.2s}
.btn-delete:hover{background:#c0392b}
/* Tabla */
.table-container{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);overflow-x:auto;box-shadow:var(--shadow)}
table{width:100%;border-collapse:collapse}
th,td{padding:16px;text-align:left;border-bottom:1px solid var(--border);font-size:13px}
th{background:#F8FAFE;font-weight:600;color:var(--navy);font-size:12px;text-transform:uppercase;letter-spacing:.5px}
tr:hover{background:#F9F9FF}
.badge-active{background:#ECFDF5;color:#059669;padding:4px 10px;border-radius:20px;font-size:11px;font-weight:600}
.badge-inactive{background:#FEF2F2;color:#DC2626;padding:4px 10px;border-radius:20px;font-size:11px;font-weight:600}
/* Modal */
.modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);justify-content:center;align-items:center;z-index:1000}
.modal-content{background:var(--card);border-radius:var(--radius);padding:28px;width:90%;max-width:520px;max-height:85vh;overflow-y:auto;animation:fadeUp .3s ease}
.modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}
.modal-header h2{font-family:'Outfit',sans-serif;font-size:20px;font-weight:700;color:var(--navy)}
.close-modal{font-size:28px;cursor:pointer;color:var(--text-2);transition:.2s}
.close-modal:hover{color:var(--danger)}
.form-group{margin-bottom:18px}
.form-group label{display:block;font-size:12px;font-weight:600;color:var(--text-2);margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px}
.form-group input,.form-group select{width:100%;padding:10px 14px;border:1px solid var(--border);border-radius:10px;font-family:'DM Sans',sans-serif;font-size:13px;transition:.2s}
.form-group input:focus,.form-group select:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px var(--gold-glow)}
.form-actions{display:flex;justify-content:flex-end;gap:12px;margin-top:24px}
.btn-cancel{background:var(--border);color:var(--text-2);border:none;padding:10px 20px;border-radius:10px;font-weight:500;cursor:pointer}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
</style>
</head>
<body>
<header class="topbar">
  <div class="topbar-left">
    <span class="hbg" onclick="toggleSidebar()">☰</span>
    <div class="brand"><div class="brand-badge">TEC<br>NM</div><div class="brand-name">Tecnológico Nacional de México<span>Portal Estudiantes</span></div></div>
  </div>
  <div class="topbar-right">
    <span class="rol-tag">Coordinador</span>
    <div class="avatar">👤</div>
    <button class="logout-btn" onclick="location.href='login.html'">Cerrar sesión</button>
  </div>
</header>
<div class="layout">
  <div id="main-sidebar"><div id="sidebar-container" style="display:flex;flex-direction:column;height:100%"></div></div>
  <script src="sidebaradmi.js"></script>
  <main class="main">
    <div class="breadcrumb">Portal Coordinador <span>›</span> <span>Alumnos</span></div>
    <div class="page-header">
      <h1><span style="color:var(--gold);">👨‍🎓</span> Gestión de Alumnos</h1>
      <button class="btn-primary" onclick="abrirModalAgregar()"><span>+</span> Nuevo Alumno</button>
    </div>
    <div class="table-container">
      <table>
        <thead><tr><th>ID</th><th>Matrícula</th><th>Nombre</th><th>Carrera</th><th>Semestre</th><th>Estatus</th><th>Acciones</th></tr></thead>
        <tbody id="tabla-alumnos"><tr><td colspan="7" style="text-align:center;padding:40px;">Cargando alumnos...</td></tr></tbody>
      </table>
    </div>
  </main>
</div>
<div id="modalAlumno" class="modal">
  <div class="modal-content">
    <div class="modal-header"><h2 id="modalTitulo">Agregar Alumno</h2><span class="close-modal" onclick="cerrarModal()">&times;</span></div>
    <form id="formAlumno">
      <input type="hidden" id="alumno_id">
      <div class="form-group"><label>Matrícula</label><input type="text" id="matricula" required></div>
      <div class="form-group"><label>Nombre</label><input type="text" id="nombre" required></div>
      <div class="form-group"><label>Apellido Paterno</label><input type="text" id="apellido_p"></div>
      <div class="form-group"><label>Apellido Materno</label><input type="text" id="apellido_m"></div>
      <div class="form-group"><label>Email</label><input type="email" id="email"></div>
      <div class="form-group"><label>Semestre</label><select id="semestre"><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option><option>7</option><option>8</option><option>9</option><option>10</option></select></div>
      <div class="form-group"><label>Carrera</label><select id="carrera"><option>ING. INFORMÁTICA</option><option>ING. SISTEMAS</option></select></div>
      <div class="form-actions"><button type="button" class="btn-cancel" onclick="cerrarModal()">Cancelar</button><button type="submit" class="btn-primary">Guardar</button></div>
    </form>
  </div>
</div>
<script>
  function toggleSidebar(){const s=document.getElementById('main-sidebar');if(s)s.classList.toggle('collapsed')}
  function abrirModalAgregar(){document.getElementById('modalTitulo').innerText='Agregar Alumno';document.getElementById('formAlumno').reset();document.getElementById('alumno_id').value='';document.getElementById('modalAlumno').style.display='flex'}
  function cerrarModal(){document.getElementById('modalAlumno').style.display='none'}
  function cargarAlumnos(){/* Fetch a la API */document.getElementById('tabla-alumnos').innerHTML='<tr><td colspan="7" style="text-align:center;">Conectando...</td></tr>'}
  function guardarAlumno(e){e.preventDefault();/* POST/PUT */}
  function editarAlumno(id){/* Cargar datos y abrir modal */}
  function eliminarAlumno(id){if(confirm('¿Eliminar este alumno?')){/* DELETE */}}
  document.getElementById('formAlumno').addEventListener('submit',guardarAlumno);cargarAlumnos();
</script>
</body>
</html>
