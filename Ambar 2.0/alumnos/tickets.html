<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tickets — Portal Estudiante TecNM</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--navy:#0D1B3E;--navy-mid:#1D3461;--gold:#E8A100;--gold-lt:#FFF3D0;--gold-glow:rgba(232,161,0,.18);--bg:#F0F4FA;--card:#FFFFFF;--text:#1A1F36;--text-2:#5A6488;--border:#E2E8F0;--radius:14px;--shadow:0 4px 24px rgba(13,27,62,.09)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);display:flex;flex-direction:column;height:100vh;overflow:hidden}
.topbar{background:var(--navy);height:58px;display:flex;align-items:center;justify-content:space-between;padding:0 24px;position:fixed;inset:0 0 auto 0;z-index:200;box-shadow:0 2px 16px rgba(0,0,0,.3)}
.topbar-left{display:flex;align-items:center;gap:16px}
.hbg{color:white;font-size:22px;cursor:pointer;width:36px;height:36px;display:flex;align-items:center;justify-content:center;border-radius:8px;transition:.2s}
.hbg:hover{background:rgba(255,255,255,.12)}
.brand{display:flex;align-items:center;gap:10px}
.brand-badge{width:36px;height:36px;background:var(--gold);border-radius:8px;display:flex;align-items:center;justify-content:center;font-family:'Outfit',sans-serif;font-size:11px;font-weight:800;color:var(--navy);line-height:1.1;text-align:center}
.brand-name{color:white;font-family:'Outfit',sans-serif;font-size:13px;font-weight:600;line-height:1.3}
.brand-name span{display:block;font-size:10px;font-weight:300;opacity:.7;letter-spacing:.6px;text-transform:uppercase}
.topbar-right{display:flex;align-items:center;gap:12px}
.stu-tag{background:rgba(59,130,246,.25);border:1px solid rgba(59,130,246,.5);color:#93C5FD;font-size:11px;font-weight:600;padding:4px 10px;border-radius:20px;letter-spacing:.4px;text-transform:uppercase}
.avatar{width:34px;height:34px;background:var(--gold);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;cursor:pointer;font-weight:700;color:var(--navy)}
.logout-btn{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);color:rgba(255,255,255,.8);font-size:12px;padding:6px 12px;border-radius:8px;cursor:pointer;transition:.2s;font-family:'DM Sans',sans-serif}
.logout-btn:hover{background:rgba(255,255,255,.15);color:white}
.layout{display:flex;margin-top:58px;height:calc(100vh - 58px);overflow:hidden}
#main-sidebar{width:235px;background:var(--navy);display:flex;flex-direction:column;flex-shrink:0}
.main{flex:1;overflow-y:auto;padding:28px 32px;background:var(--bg)}
.breadcrumb{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text-2);margin-bottom:8px}
.breadcrumb span{color:var(--gold);font-weight:600}
.header-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px;animation:fadeUp .5s ease both}
.page-h1{font-family:'Outfit',sans-serif;font-size:26px;font-weight:700;color:var(--navy)}
.btn-generar{background:var(--gold);color:var(--navy);border:none;padding:11px 22px;font-size:13px;font-weight:700;border-radius:8px;cursor:pointer;transition:.2s;font-family:'DM Sans',sans-serif}
.btn-generar:hover{background:#d4930a;box-shadow:0 4px 14px rgba(232,161,0,.4)}
/* TABLE CARD */
.table-card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);border:1px solid var(--border);overflow:hidden;max-width:900px;animation:fadeUp .5s ease .08s both}
/* TABS */
.tabs{display:flex;border-bottom:1px solid var(--border)}
.tab{flex:1;text-align:center;padding:12px 0;font-size:12.5px;font-weight:700;letter-spacing:.5px;color:var(--text-2);cursor:pointer;border-bottom:2px solid transparent;transition:.2s;text-transform:uppercase}
.tab:hover{color:var(--navy)}
.tab.active{color:var(--navy);border-bottom-color:var(--gold);background:var(--gold-lt)}
table{width:100%;border-collapse:collapse}
thead th{text-align:left;padding:10px 18px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.7px;color:var(--text-2);border-bottom:1px solid var(--border);background:#FAFBFF}
tbody td{padding:18px;font-size:13px;color:var(--text-2);text-align:center;border-bottom:1px solid #F1F5FB}
tbody tr:last-child td{border-bottom:none}
/* PAGINATION */
.pagination{display:flex;align-items:center;justify-content:flex-end;gap:10px;padding:14px 18px;border-top:1px solid var(--border);font-size:12.5px;color:var(--text-2)}
.per-page{border:1px solid var(--border);border-radius:6px;padding:4px 8px;font-size:12px;color:var(--text);background:white;cursor:pointer;font-family:'DM Sans',sans-serif}
.page-info{font-size:12px;color:var(--text-2);margin:0 4px}
.page-btn{background:none;border:none;cursor:pointer;font-size:14px;color:var(--text-2);padding:2px 4px;transition:.15s;border-radius:4px}
.page-btn:hover{background:var(--bg);color:var(--navy)}
.page-btn.disabled{color:var(--border);cursor:default;pointer-events:none}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
</style>
</head>
<body>
<header class="topbar">
  <div class="topbar-left">
    <span class="hbg" onclick="toggleSidebar()">☰</span>
    <div class="brand">
      <div class="brand-badge">TEC<br>NM</div>
      <div class="brand-name">Tecnológico Nacional de México<span>Portal Estudiantes</span></div>
    </div>
  </div>
  <div class="topbar-right">
    <span class="stu-tag">Estudiante</span>
    <div class="avatar">👤</div>
    <button class="logout-btn">Cerrar sesión</button>
  </div>
</header>
<div class="layout">
  <div id="main-sidebar"><div id="sidebar-container" style="display:flex;flex-direction:column;height:100%"></div></div>
  <script src="sidebar.js"></script>
  <main class="main">
    <div class="breadcrumb">Portal Estudiantes <span>›</span> <span>Tickets</span></div>
    <div class="header-row">
      <div class="page-h1">Tickets de Soporte</div>
      <button class="btn-generar">🎫 Generar Ticket</button>
    </div>
    <div class="table-card">
      <div class="tabs">
        <div class="tab active" data-estatus="ABIERTO">Abiertos</div>
        <div class="tab" data-estatus="FINALIZADO">Finalizados</div>
      </div>
      <table>
        <thead>
          <tr>
            <th style="width:15%">Fecha</th>
            <th style="width:12%">Clave</th>
            <th style="width:25%">Descripción</th>
            <th style="width:12%">Estatus</th>
            <th style="width:8%; text-align:center">Acción</th>
            <th style="width:28%">Comentario</th>
          </tr>
        </thead>
        <tbody id="tabla-body">
          <tr><td colspan="6" style="padding:40px;text-align:center">Cargando tickets...</td></tr>
        </tbody>
      </table>
      <div class="pagination">
        <span class="page-info" id="ticket-count">Mostrando 0 tickets</span>
      </div>
    </div>
  </main>
</div>
<script>
function switchTab(el){
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  el.classList.add('active');
}
</script>
</body>
</html>
