<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Histórico de Actividades - TecNM</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Roboto', sans-serif; background: #f5f5f5; color: #333; display: flex; flex-direction: column; height: 100vh; }

        /* TOPBAR */
        .topbar { background: #1a2a4a; height: 56px; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; position: fixed; top: 0; left: 0; right: 0; z-index: 100; }
        .topbar-left { display: flex; align-items: center; gap: 16px; }
        .hamburger { color: white; font-size: 22px; cursor: pointer; }
        .logo-area { display: flex; align-items: center; gap: 10px; }
        .logo-circle { width: 38px; height: 38px; background: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 700; color: #1a2a4a; text-align: center; line-height: 1.1; }
        .logo-text { color: white; font-size: 13px; font-weight: 500; line-height: 1.3; }
        .topbar-right { display: flex; align-items: center; gap: 12px; color: white; font-size: 14px; font-weight: 500; }
        .avatar-icon { width: 32px; height: 32px; background: rgba(255,255,255,0.2); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 16px; }

        /* LAYOUT */
        .layout { display: flex; margin-top: 56px; height: calc(100vh - 56px); }

        /* SIDEBAR */
        .sidebar { width: 240px; background: white; border-right: 1px solid #e0e0e0; flex-shrink: 0; display: flex; flex-direction: column; overflow-y: auto; }
        .nav-list { flex: 1; }
        .nav-item { display: flex; align-items: center; gap: 14px; padding: 14px 20px; cursor: pointer; font-size: 14px; color: #444; border-left: 3px solid transparent; transition: background 0.15s; }
        .nav-item:hover { background: #f0f4ff; }
        .nav-item.active { background: #eef2ff; border-left: 3px solid #1a2a4a; color: #1a2a4a; font-weight: 500; }
        .nav-icon { font-size: 18px; width: 22px; text-align: center; }
        .nav-bottom { border-top: 1px solid #e0e0e0; }

        /* MAIN */
        .main { flex: 1; overflow-y: auto; background: white; }

        /* SECCIÓN */
        .seccion {
            padding: 28px 32px 24px 32px;
            border-bottom: 1px solid #e0e0e0;
        }

        .seccion-titulo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 17px;
            font-weight: 600;
            color: #1a5276;
            margin-bottom: 16px;
        }

        .seccion-titulo span { font-size: 18px; }

        .seccion-mensaje {
            font-size: 13px;
            color: #555;
            padding-left: 2px;
        }
    </style>
</head>
<body>

<!-- TOPBAR -->
<div class="topbar">
    <div class="topbar-left">
        <span class="hamburger" onclick="toggleSidebar()">☰</span>
        <div class="logo-area">
            <div class="logo-circle">TEC<br>NM</div>
            <div class="logo-text">TECNOLÓGICO<br>NACIONAL DE MÉXICO</div>
        </div>
    </div>
    <div class="topbar-right">
        <span>INGENIERIA INFORMATICA</span>
        <div class="avatar-icon">👤</div>
    </div>
</div>

<div class="layout">

    <!-- SIDEBAR -->
   <div id="sidebar-container"></div>
   <script src="sidebar.js"></script>

    <!-- MAIN -->
    <div class="main">

        <!-- Actividades complementarias -->
        <div class="seccion">
            <div class="seccion-titulo">
                <span>📄</span> Actividades complementarias
            </div>
            <div class="seccion-mensaje">No cuenta con actividades complementarias registradas</div>
        </div>

        <!-- Actividades extraescolares -->
        <div class="seccion">
            <div class="seccion-titulo">
                <span>📄</span> Actividades extraescolares
            </div>
            <div class="seccion-mensaje">No cuenta con actividades extraescolares registradas</div>
        </div>

        <!-- Tutorías -->
        <div class="seccion">
            <div class="seccion-titulo">
                <span>📄</span> Tutorías
            </div>
            <div class="seccion-mensaje">No cuenta con tutorías registradas</div>
        </div>

    </div>
</div>

</body>
</html>
