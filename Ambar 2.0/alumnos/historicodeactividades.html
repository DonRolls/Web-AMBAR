<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Histórico de Actividades — Portal Estudiante TecNM</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--navy:#0D1B3E;--navy-mid:#1D3461;--gold:#E8A100;--gold-lt:#FFF3D0;--gold-glow:rgba(232,161,0,.18);--bg:#F0F4FA;--card:#FFFFFF;--text:#1A1F36;--text-2:#5A6488;--border:#E2E8F0;--radius:14px;--shadow:0 4px 24px rgba(13,27,62,.09)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);display:flex;flex-direction:column;height:100vh;overflow:hidden}
.topbar{background:var(--navy);height:58px;display:flex;align-items:center;justify-content:space-between;padding:0 24px;position:fixed;inset:0 0 auto 0;z-index:200;box-shadow:0 2px 16px rgba(0,0,0,.3)}
.topbar-left{display:flex;align-items:center;gap:16px}
.hbg{color:white;font-size:22px;cursor:pointer;width:36px;height:36px;display:flex;align-items:center;justify-content:center;border-radius:8px;transition:.2s}
.hbg:hover{background:rgba(255,255,255,.12)}
.brand{display:flex;align-items:center;gap:10px}
.brand-badge{width:36px;height:36px;background:var(--gold);border-radius:8px;display:flex;align-items:center;justify-content:center;font-family:'Outfit',sans-serif;font-size:11px;font-weight:800;color:var(--navy);line-height:1.1;text-align:center}
.brand-name{color:white;font-family:'Outfit',sans-serif;font-size:13px;font-weight:600;line-height:1.3}
.brand-name span{display:block;font-size:10px;font-weight:300;opacity:.7;letter-spacing:.6px;text-transform:uppercase}
.topbar-right{display:flex;align-items:center;gap:12px}
.stu-tag{background:rgba(59,130,246,.25);border:1px solid rgba(59,130,246,.5);color:#93C5FD;font-size:11px;font-weight:600;padding:4px 10px;border-radius:20px;letter-spacing:.4px;text-transform:uppercase}
.avatar{width:34px;height:34px;background:var(--gold);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;cursor:pointer;font-weight:700;color:var(--navy)}
.logout-btn{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);color:rgba(255,255,255,.8);font-size:12px;padding:6px 12px;border-radius:8px;cursor:pointer;transition:.2s;font-family:'DM Sans',sans-serif}
.logout-btn:hover{background:rgba(255,255,255,.15);color:white}
.layout{display:flex;margin-top:58px;height:calc(100vh - 58px);overflow:hidden}
#main-sidebar{width:235px;background:var(--navy);display:flex;flex-direction:column;flex-shrink:0}
.main{flex:1;overflow-y:auto;padding:28px 32px;background:var(--bg)}
.breadcrumb{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text-2);margin-bottom:8px}
.breadcrumb span{color:var(--gold);font-weight:600}
.page-header{margin-bottom:24px;animation:fadeUp .5s ease both}
.page-header h1{font-family:'Outfit',sans-serif;font-size:26px;font-weight:700;color:var(--navy);letter-spacing:-.3px}
/* SECTION */
.seccion{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:22px 24px;margin-bottom:14px;box-shadow:var(--shadow);max-width:780px;animation:fadeUp .5s ease both}
.seccion:nth-child(1){animation-delay:.08s}
.seccion:nth-child(2){animation-delay:.13s}
.seccion:nth-child(3){animation-delay:.18s}
.seccion-titulo{font-family:'Outfit',sans-serif;font-size:15px;font-weight:700;color:var(--navy);margin-bottom:12px;display:flex;align-items:center;gap:8px}
.sec-icon{width:28px;height:28px;border-radius:7px;background:var(--gold-lt);color:var(--gold);display:flex;align-items:center;justify-content:center;font-size:14px}
.seccion-mensaje{font-size:13px;color:var(--text-2);font-style:italic;padding:10px 14px;background:var(--bg);border-radius:8px;border:1px dashed var(--border)}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
</style>
</head>
<body>
<header class="topbar">
  <div class="topbar-left">
    <span class="hbg" onclick="toggleSidebar()">☰</span>
    <div class="brand">
      <div class="brand-badge">TEC<br>NM</div>
      <div class="brand-name">Tecnológico Nacional de México<span>Portal Estudiantes</span></div>
    </div>
  </div>
  <div class="topbar-right">
    <span class="stu-tag">Estudiante</span>
    <div class="avatar">👤</div>
    <button class="logout-btn">Cerrar sesión</button>
  </div>
</header>
<div class="layout">
  <div id="main-sidebar"><div id="sidebar-container" style="display:flex;flex-direction:column;height:100%"></div></div>
  <script src="sidebar.js"></script>
  <main class="main">
    <div class="breadcrumb">Portal Estudiantes <span>›</span> <span>Histórico de Actividades</span></div>
    <div class="page-header"><h1>Histórico de Actividades</h1></div>
    
    <!-- IDs añadidos para asegurar que el JS inyecte donde corresponde -->
    <div class="seccion" id="sec-complementarias">
      <div class="seccion-titulo"><div class="sec-icon">📄</div>Actividades complementarias</div>
      <div class="seccion-mensaje">Cargando información...</div>
    </div>

    <div class="seccion" id="sec-extraescolares">
      <div class="seccion-titulo"><div class="sec-icon">🏀</div>Actividades extraescolares</div>
      <div class="seccion-mensaje">Cargando información...</div>
    </div>

    <div class="seccion" id="sec-tutorias">
      <div class="seccion-titulo"><div class="sec-icon">👥</div>Tutorías</div>
      <div class="seccion-mensaje">Cargando información...</div>
    </div>
  </main>
</div>
</body>
</html>
