<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soporte Técnico - Sistema Ámbar</title>
    <style>
        :root {
            --tecnm-blue: #1B396A;
            --tecnm-gold: #B8860B;
            --light-gray: #f4f4f4;
            --white: #ffffff;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--light-gray);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .container {
            background-color: var(--white);
            width: 100%;
            max-width: 600px;
            padding: 2rem;
            border-top: 8px solid var(--tecnm-blue);
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            border-radius: 8px;
        }

        .header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .header h1 {
            color: var(--tecnm-blue);
            font-size: 1.5rem;
            margin: 0;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .header p {
            color: #666;
            font-size: 0.9rem;
        }

        .form-group {
            margin-bottom: 1.2rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: bold;
            color: #333;
        }

        input[type="text"],
        input[type="email"],
        select,
        textarea {
            width: 100%;
            padding: 0.8rem;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box; /* Asegura que el padding no afecte el ancho */
            font-size: 1rem;
        }

        textarea {
            resize: vertical;
            min-height: 100px;
        }

        .btn-submit {
            background-color: var(--tecnm-blue);
            color: white;
            padding: 1rem 2rem;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: bold;
            width: 100%;
            transition: background-color 0.3s;
        }

        .btn-submit:hover {
            background-color: #12264a;
        }

        .footer-note {
            font-size: 0.8rem;
            color: #888;
            text-align: center;
            margin-top: 1.5rem;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>Soporte Técnico Ámbar</h1>
        <p>Tecnológico Nacional de México</p>
    </div>

    <form action="#" method="POST">
        <div class="form-group">
            <label for="nombre">Nombre Completo</label>
            <input type="text" id="nombre" name="nombre" placeholder="Ej. Juan Pérez López" required>
        </div>

        <div class="form-group">
            <label for="correo">Correo Institucional</label>
            <input type="email" id="correo" name="correo" placeholder="usuario@itjiquilpan.edu.mx" required>
        </div>

        <div class="form-group">
            <label for="categoria">Área de Incidencia</label>
            <select id="categoria" name="categoria" required>
                <option value="">Seleccione una opción...</option>
                <option value="red">Redes y Conectividad</option>
                <option value="software">Software / Plataforma Ámbar</option>
                <option value="hardware">Mantenimiento de Equipo</option>
                <option value="cuentas">Acceso y Contraseñas</option>
            </select>
        </div>

        <div class="form-group">
            <label for="descripcion">Descripción del Problema</label>
            <textarea id="descripcion" name="descripcion" placeholder="Describa detalladamente su solicitud..." required></textarea>
        </div>

        <button type="submit" class="btn-submit">Enviar Solicitud</button>
    </form>

    <div class="footer-note">
        Este es un sistema de gestión interna. Todos los tickets son monitoreados.
    </div>
</div>

</body>
</html>
